<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>TraceAR</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="stage">

    <video
        id="cameraFeed"
        autoplay
        playsinline
        muted
    ></video>

    <img
        id="traceImage"
        draggable="false"
        alt="Tracing Reference"
    >

</div>

    <div id="controlPanel">

        <div id="panelHeader">

            <span id="panelTitle">TraceAR</span>

            <div class="headerButtons">

                <button id="panelLockBtn" title="Lock Panel">
                    📌
                </button>

                <button id="minimizeBtn" title="Minimize">
                    —
                </button>

            </div>

        </div>

        <div id="panelContent">

            <div class="section">

                <label class="uploadBtn">

                    Upload

                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        hidden
                    >

                </label>

                <button id="removeBtn">
                    Remove
                </button>

            </div>

            <div class="section">

                <label>

                    Opacity

                    <input
                        type="range"
                        id="opacitySlider"
                        min="5"
                        max="100"
                        value="40"
                    >

                </label>

            </div>

            <div class="section">

                <label>

                    Scale

                    <input
                        type="range"
                        id="scaleSlider"
                        min="10"
                        max="1000"
                        value="100"
                    >

                </label>

            </div>

            <div class="section">

                <div class="rotationControls">

                    <button id="rotateLeft1">
                        ↺1°
                    </button>

                    <button id="rotateRight1">
                        ↻1°
                    </button>

                </div>

                <div class="rotationControls">

                    <button id="rotateLeft15">
                        ↺15°
                    </button>

                    <button id="rotateRight15">
                        ↻15°
                    </button>

                </div>

            </div>

            <div class="section">

                <button id="imageLockBtn">
                    🔒 Image Lock
                </button>

                <button id="rotationLockBtn">
                    🌍 Rotation Lock
                </button>

            </div>

            <div class="section">

                <button id="startCameraBtn">
                    📷 Start Camera
                </button>

                <button id="stopCameraBtn">
                    📷 Stop Camera
                </button>

            </div>

            <div class="section">

                <button id="traceModeBtn">
                    ✏ Trace Mode
                </button>

                <button id="fullscreenBtn">
                    ⛶ Fullscreen
                </button>

                <button id="resetBtn">
                    ↺ Reset
                </button>

            </div>

            </div>

        </div>

    </div>

    <div id="dpad">
        <button id="nudgeUp" class="dpad-btn">▲</button>
        <button id="nudgeLeft" class="dpad-btn">◀</button>
        <button id="nudgeRight" class="dpad-btn">▶</button>
        <button id="nudgeDown" class="dpad-btn">▼</button>
    </div>

    <button id="panelToggle">

        ☰

    </button>

    <div id="statusBar">

        <span id="statusImageLock">
            🔒 OFF
        </span>

        <span id="statusPanelLock">
            📌 OFF
        </span>

        <span id="statusRotationLock">
            🌍 OFF
        </span>

        <span id="statusOpacity">
            40%
        </span>

    </div>

    <div id="toast">

        Ready

    </div>

    <script src="script.js"></script>

</body>
</html>
